name: Daily Link Check

on:
  schedule:
    # 10:00 PKT (UTC+5) -> 05:00 UTC
    - cron: '0 4 * * *'
    # 17:00 PKT (UTC+5) -> 12:00 UTC
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  run-tests:
    name: Run Cypress link check and send report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests (link check)
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          REPORT_RECEIVER_EMAIL: ${{ secrets.REPORT_RECEIVER_EMAIL }}
          REPORT_RECEIVER_EMAIL_2: ${{ secrets.REPORT_RECEIVER_EMAIL_2 }}
        run: npx cypress run --browser chrome
